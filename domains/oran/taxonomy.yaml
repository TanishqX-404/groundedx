name: oran
taxonomy:
  - class: PCI_COLLISION
    domain: RAN
    alarms: [ALM-PCI-CONFLICT, ALM-HO-DEGRADE]
    kpi_effects: {handover_failure_rate: 0.12, rsrq_db: -3.0, sinr_db: -4.0}
    pattern: step
    remediation: Reassign physical cell IDs and validate neighbor PCI uniqueness.
  - class: BACKHAUL_CONGESTION
    domain: Transport
    alarms: [ALM-BH-LATENCY, ALM-PACKET-LOSS]
    kpi_effects: {latency_ms: 35, packet_loss_pct: 2.5, throughput_mbps: -28}
    pattern: ramp
    remediation: Check transport queue utilization, reroute traffic, or increase backhaul capacity.
  - class: HARDWARE_DEGRADATION
    domain: RAN
    alarms: [ALM-RRU-DEGRADE, ALM-TX-POWER-LOW]
    kpi_effects: {rsrp_dbm: -8.0, throughput_mbps: -18, availability_pct: -1.5}
    pattern: ramp
    remediation: Inspect RRU health, cabling, and replace degraded radio hardware if confirmed.
  - class: INTERFERENCE_SPIKE
    domain: RAN
    alarms: [ALM-UL-INTERFERENCE, ALM-SINR-LOW]
    kpi_effects: {sinr_db: -7.0, packet_loss_pct: 1.8, throughput_mbps: -22}
    pattern: spike
    remediation: Locate interference source and adjust power, tilt, or frequency planning.
  - class: NEIGHBOR_LIST_MISCONFIG
    domain: RAN
    alarms: [ALM-NBR-MISSING, ALM-HO-DEGRADE]
    kpi_effects: {handover_failure_rate: 0.10, drop_call_rate: 0.05}
    pattern: step
    remediation: Audit and repair neighbor relations, then verify mobility counters.
  - class: VNF_CPU_EXHAUSTION
    domain: Core
    alarms: [ALM-VNF-CPU-HIGH, ALM-SERVICE-DELAY]
    kpi_effects: {cpu_util_pct: 35, latency_ms: 25, setup_success_rate: -0.07}
    pattern: ramp
    remediation: Scale the VNF, rebalance workload, and check noisy neighbor processes.
  - class: HANDOVER_PARAM_MISCONFIG
    domain: RAN
    alarms: [ALM-HO-DEGRADE, ALM-A3-OFFSET]
    kpi_effects: {handover_failure_rate: 0.09, ping_pong_rate: 0.07}
    pattern: step
    remediation: Restore handover thresholds, hysteresis, and time-to-trigger values.
  - class: POWER_AMPLIFIER_FAULT
    domain: RAN
    alarms: [ALM-PA-FAULT, ALM-TX-POWER-LOW]
    kpi_effects: {rsrp_dbm: -10.0, throughput_mbps: -20, availability_pct: -2.0}
    pattern: step
    remediation: Inspect PA module and replace or recalibrate the transmitter chain.
  - class: TIMING_SYNC_LOSS
    domain: RAN
    alarms: [ALM-PTP-UNLOCK, ALM-SYNC-LOSS]
    kpi_effects: {handover_failure_rate: 0.08, latency_ms: 18, setup_success_rate: -0.06}
    pattern: spike
    remediation: Restore PTP/GNSS timing source and verify synchronization lock.
  - class: OVERLOAD_ADMISSION_CONTROL
    domain: RAN
    alarms: [ALM-CELL-OVERLOAD, ALM-ADMISSION-REJECT]
    kpi_effects: {prb_util_pct: 30, setup_success_rate: -0.10, latency_ms: 20}
    pattern: ramp
    remediation: Tune admission thresholds, add capacity, or offload users to neighbors.
  - class: S1_NG_INTERFACE_FLAP
    domain: Core
    alarms: [ALM-NG-FLAP, ALM-SIGNALING-LOSS]
    kpi_effects: {setup_success_rate: -0.08, latency_ms: 22, drop_call_rate: 0.04}
    pattern: spike
    remediation: Check NG/S1 link stability, transport errors, and endpoint keepalive settings.
  - class: DNS_RESOLUTION_FAILURE
    domain: Core
    alarms: [ALM-DNS-FAIL, ALM-SERVICE-DELAY]
    kpi_effects: {setup_success_rate: -0.06, latency_ms: 30}
    pattern: step
    remediation: Restore DNS reachability and validate service discovery records.
  - class: SLICE_QOS_POLICY_ERROR
    domain: Core
    alarms: [ALM-QOS-POLICY, ALM-SLICE-SLA]
    kpi_effects: {latency_ms: 28, throughput_mbps: -24, packet_loss_pct: 1.2}
    pattern: step
    remediation: Correct slice QoS policy mapping and reapply SLA profiles.
  - class: FRONTHAUL_JITTER
    domain: Transport
    alarms: [ALM-FH-JITTER, ALM-ECPRI-DELAY]
    kpi_effects: {latency_ms: 24, sinr_db: -2.5, packet_loss_pct: 1.5}
    pattern: spike
    remediation: Inspect fronthaul timing, transport queues, and eCPRI delay variation.
  - class: CONFIG_ROLLBACK_REQUIRED
    domain: RAN
    alarms: [ALM-CONFIG-CHANGE, ALM-KPI-REGRESSION]
    kpi_effects: {throughput_mbps: -18, setup_success_rate: -0.05, drop_call_rate: 0.03}
    pattern: step
    remediation: Roll back recent configuration change and perform controlled revalidation.
  - class: COOLING_SYSTEM_FAILURE
    domain: Site
    alarms: [ALM-TEMP-HIGH, ALM-RRU-DEGRADE]
    kpi_effects: {availability_pct: -2.5, throughput_mbps: -16, cpu_util_pct: 15}
    pattern: ramp
    remediation: Restore site cooling and verify radio/baseband thermal status.

